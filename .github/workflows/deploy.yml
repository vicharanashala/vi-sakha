name: Build & Deploy All Services

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Also deploy to production?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  packages: write

env:
  GCP_REGION: asia-south1

jobs:
  # ============================================================
  # Build all 4 custom service images in parallel
  # (Redis uses the official image — no build needed)
  # ============================================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # backend & discord-bot use root context (monorepo workspaces)
          - service: backend
            dockerfile: backend/Dockerfile
            context: .
            image: vi-sakha-backend
          - service: frontend
            dockerfile: frontend/Dockerfile
            context: ./frontend
            image: vi-sakha-frontend
          - service: discord-bot
            dockerfile: discord-bot/Dockerfile
            context: .
            image: vi-sakha-discord-bot
          - service: rag-server
            dockerfile: rag-server/Dockerfile
            context: ./rag-server
            image: vi-sakha-rag-server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create gitignored files needed by backend Docker build
        if: matrix.service == 'backend'
        run: |
          # backend/Dockerfile COPYs these files but they are gitignored.
          # The .dockerignore whitelists them (!backend/.env, !backend/service-account.json).
          # Create safe placeholders so the COPY instructions succeed in CI.
          if [ ! -f backend/.env ]; then
            echo "NODE_ENV=production" > backend/.env
            echo "PORT=3000" >> backend/.env
          fi
          if [ ! -f backend/service-account.json ]; then
            echo '{}' > backend/service-account.json
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}

  # ============================================================
  # Optional: Deploy to Cloud Run (Staging)
  # Only runs on manual workflow_dispatch
  # ============================================================
  deploy_staging:
    name: Deploy to Cloud Run (Staging)
    if: github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vi-sakha-backend-staging
          region: ${{ env.GCP_REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/vi-sakha-backend:${{ github.sha }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          flags: --allow-unauthenticated

  # ============================================================
  # Optional: Deploy to Cloud Run (Production)
  # Only runs on manual workflow_dispatch with deploy_production=true
  # ============================================================
  deploy_production:
    name: Deploy to Cloud Run (Production)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy Backend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: vi-sakha-backend-production
          region: ${{ env.GCP_REGION }}
          image: ${{ secrets.DOCKERHUB_USERNAME }}/vi-sakha-backend:${{ github.sha }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          flags: --allow-unauthenticated
