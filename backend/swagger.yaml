      description: >-
        Fulfills US14 (performance analytics). Evaluates overall AI bot effectiveness
        and customer satisfaction percentage.
      operationId: FeedbackController_getFeedbackRatio
      parameters: []
      responses:
        '200':
          description: Overall binary satisfaction distribution returned.
      summary: Aggregated Feedback Ratio
      tags: *ref_analytics
  /analytics/topic/{topic}:
    get:
      description: >-
        Fulfills US12 by isolating the exact failed conversations of a specific
        topic category so lab members can review what went wrong.
      operationId: FeedbackController_getByTopic
      parameters:
        - name: topic
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: List of individual defective messages.
        '404':
          description: Topic strings not found.
      summary: Topic Detail Drilldown
      tags: *ref_analytics
  /analytics/dashboard-summary:
    get:
      description: >-
        Calculates high-level metrics for the dashboard home view, including
        query volume, AI resolution rates, and Knowledge Base health.
      operationId: FeedbackController_getSummary
      parameters: []
      responses:
        '200':
          description: Aggregated KPIs returned.
      summary: Dashboard KPI Summary
      tags: *ref_analytics
  /ai/insights:
    post:
      description: Get AI-powered metric insights and anomalies based on quantitative analysis and contribution data.
      operationId: AiAnalyticsController_getInsights
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metric:
                  type: string
                  enum: [queries, tickets]
                forceRefresh:
                  type: boolean
              required:
                - metric
      responses:
        '200':
          description: AI-powered metric insights and anomalies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIInsight'
      summary: Get AI-powered metric insights and anomalies
      tags: &ref_ai_analytics
        - AI Analytics
  /ai/query:
    post:
      description: Natural language query interface for exploring system data (Ask Your Data).
      operationId: AiAnalyticsController_askYourData
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
              required:
                - query
      responses:
        '200':
          description: Natural language query results with visualization strategy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NLQResponse'
      summary: Natural language query interface (Ask Your Data)
      tags: *ref_ai_analytics
  /admin/analytics/qa-growth:
    get:
      description: Returns time-series data of processed QA pairs for growth visualization.
      operationId: AdminController_getQaGrowth
      parameters: []
      responses:
        '200':
          description: QA accumulation metrics.
      security:
        - bearer: []
      summary: Get QA accumulation metrics
      tags:
        - Admin Controls
  /admin/analytics/performance:
    get:
      description: Returns resolution counts for application-native tickets by staff members.
      operationId: AdminController_getPerformance
      parameters: []
      responses:
        '200':
          description: Lab member resolution analytics.
      security:
        - bearer: []
      summary: Get Lab Member Performance
      tags:
        - Admin Controls


info:
  title: Vinternship API
  description: >-
    The high-fidelity backend API for the Vinternship Student Support System. 
    This ecosystem integrates custom-built GenAI services (Gemini 1.5 Pro) for 
    automated support, semantic RAG pipelines, and administrative governance. 
    Each endpoint fulfills specific Learner (US1-6), Support Desk (US7-10), 
    and Admin (US11-14) User Stories defined in the project scope.
    
    ### Integrated GenAI Services:
    - **RAG Pipeline**: Semantic indexing and retrieval of academic policy PDFs.
    - **Chatbot Core**: Conversational AI for instant query resolution.
    - **Embedding Engine**: Vector subspace management for knowledge mapping.
    - **Sentiment Analysis**: Feedback loops for model performance tracking.
  version: '1.0'
  contact: 
    name: Dev-Team (IITM BS Online)
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterDto:
      type: object
      properties:
        name:
          type: string
          description: Display name for the registering learner
        email:
          type: string
          description: Valid scholastic email address
        password:
          type: string
          description: Complex password, minimum 6 characters
          minLength: 6
      required:
        - name
        - email
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: Registered email address
        password:
          type: string
          description: Raw credential payload matching the hash
      required:
        - email
        - password
    CreateUserDto:
      type: object
      properties:
        name:
          type: string
          description: Display name for identity creation
        email:
          type: string
          description: User login email address
        password:
          type: string
          description: Secure user login string
        role:
          type: string
          enum:
            - student
            - lab_member
            - admin
          description: Role to be assigned inside the dashboard
        cohort:
          type: string
          description: Academic cohort code for user scoping
      required:
        - name
        - email
        - password
        - role
    CreateProposalDto:
      type: object
      properties:
        question:
          type: string
          description: The proposed question for the knowledge base
        answer:
          type: string
          description: The proposed answer that the GenAI should provide
        title:
          type: string
          description: Optional categorical title mapping
      required:
        - question
        - answer
    ReviewProposalDto:
      type: object
      properties:
        rejectionReason:
          type: string
          description: The specific feedback/reasoning if an Admin rejects the QA pair
    SendMessageDto:
      type: object
      properties:
        content:
          type: string
          description: The text content of the message sent by the user
        conversationId:
          type: string
          description: >-
            The specific conversation ID this message belongs to. Omit to start
            a new thread.
        studentId:
          type: string
          description: Student identifier string
        studentName:
          type: string
          description: Student display name
        studentEmail:
          type: string
          description: Student email address
        cohort:
          type: string
          description: Cohort identifier for academic logic
      required:
        - content
    FeedbackDto:
      type: object
      properties:
        feedback:
          type: string
          enum:
            - like
            - dislike
          description: Type of feedback submitted against an AI response
        comment:
          type: string
          description: Text explanation for the feedback (especially for dislikes)
      required:
        - feedback
    CreateConversationDto:
      type: object
      properties:
        studentId:
          type: string
          description: Student identifier string
        studentName:
          type: string
          description: Student display name
        studentEmail:
          type: string
          description: Student email address
        cohort:
          type: string
          description: Cohort identifier for academic logic
    EscalateDto:
      type: object
      properties:
        reason:
          type: string
          description: >-
            The reason why the AI interaction is being escalated to support
            staff
      required:
        - reason
    TicketScreenshotDto:
      type: object
      properties:
        fileName:
          type: string
          description: File name of the screenshot
        mimeType:
          type: string
          description: MIME type of the screenshot
        dataUrl:
          type: string
          description: Base64 data URL of the screenshot
      required:
        - fileName
        - mimeType
        - dataUrl
    CreateTicketDto:
      type: object
      properties:
        studentName:
          type: string
          description: Name of the student submitting the ticket
        studentEmail:
          type: string
          description: Email address of the student
        cohort:
          type: string
          description: Cohort identifier for the student
        subject:
          type: string
          description: Subject line of the ticket issue
          maxLength: 150
        reason:
          type: string
          description: Detailed reason or description of the issue
          maxLength: 5000
        screenshots:
          description: Optional list of screenshots attached to the ticket
          type: array
          items:
            $ref: '#/components/schemas/TicketScreenshotDto'
        conversationId:
          type: string
          description: Conversation ID if the ticket was originated from a chat session
        messageId:
          type: string
          description: Message ID if the ticket was originated from a chat session
        originalQuery:
          type: string
          description: The original query string provided by the user
        botResponse:
          type: string
          description: The bot response that caused the ticket creation
      required:
        - studentName
        - subject
        - reason
    StartMeetingDto:
      type: object
      properties:
        ticketId:
          type: string
          description: The MongoID of the ticket to generate a session link for
      required:
        - ticketId
    ResolveTicketDto:
      type: object
      properties:
        resolutionNote:
          type: string
          description: >-
            Optional resolution notes provided by the instructor upon resolving
            the ticket
          maxLength: 1000
    AssignTicketDto:
      type: object
      properties:
        instructorId:
          type: string
          description: >-
            The MongoID userId of the lab member/instructor to assign the ticket
            to
        instructorName:
          type: string
          description: Optional display name of the instructor being assigned
      required:
        - instructorId
    TransferTicketDto:
      type: object
      properties:
        toInstructorId:
          type: string
          description: The MongoID userId of the receiving lab member
        toInstructorName:
          type: string
          description: Optional display name of the receiving lab member
      required:
        - toInstructorId
    AddTicketMessageDto:
      type: object
      properties:
        message:
          type: string
          description: The contents of the message to be added to the ticket thread
          maxLength: 2000
        screenshots:
          description: Optional list of screenshots attached to the message
          type: array
          items:
            $ref: '#/components/schemas/TicketScreenshotDto'
      required:
        - message
    CloseTicketDto:
      type: object
      properties:
        resolutionNote:
          type: string
          description: Optional notes provided upon unconditionally closing the ticket
          maxLength: 1000
    CreateFeedbackDto:
      type: object
      properties:
        conversationId:
          type: string
          description: The unique identifier for the parent conversation
        messageId:
          type: string
          description: The unique identifier for the specific AI response
        messageContent:
          type: string
          description: The actual text content of the message being evaluated
        rating:
          type: string
          enum:
            - up
            - down
          description: Binary evaluation of the AI response quality
      required:
        - conversationId
        - messageId
        - messageContent
        - rating
    RunPipelineDto:
      type: object
      properties:
        mode:
          type: string
          enum:
            - backfill_embeddings
            - extract_qa
            - full
          description: The discrete execution sequence you want the ingest pipeline to take
      required:
        - mode
    ChangeRoleDto:
      type: object
      properties:
        role:
          type: string
          enum:
            - student
            - lab_member
            - admin
          description: Target user role to assign.
      required:
        - role
    SetUserStatusDto:
      type: object
      properties:
        isActive:
          type: boolean
          description: Boolean indicating whether the user is active
      required:
        - isActive
    CreateLabMemberDto:
      type: object
      properties:
        name:
          type: string
          description: Display name for the new lab member
        email:
          type: string
          description: A valid email address for authentication
        password:
          type: string
          description: A secure password, minimum 6 characters
          minLength: 6
      required:
        - name
        - email
        - password
    UpdateLabMemberDto:
      type: object
      properties:
        name:
          type: string
          description: Updated display name for the lab member
        email:
          type: string
          description: Updated email address
        password:
          type: string
          description: Updated password, minimum 6 characters
          minLength: 6
    UpdateQaPairDto:
      type: object
      properties:
        question:
          type: string
          description: The modified question payload for the knowledge base
        answer:
          type: string
          description: The modified answer payload for the knowledge base
        category:
          type: string
          description: Categorical tag for the QA entry
    McpRequestDto:
      type: object
      properties:
        query:
          type: string
          description: The query from the user to the MCP server
        context_sources:
          type: array
          items:
            type: string
          description: Specific context sources to restrict or expand retrieval
      required:
        - query
    McpResponseDto:
      type: object
      properties:
        answer:
          type: string
          description: The answer generated by the LLM via MCP
        references:
          type: array
          items:
            type: object
          description: List of references or source materials used for the answer
        attachments:
          type: array
          items:
            type: object
          description: Any attachments or tool output metadata
        confidence:
          type: number
          description: Confidence score if available
        status:
          type: string
          description: Response status
      required:
        - answer
        - references
        - attachments
    DiscordIngestionTriggerDto:
      type: object
      properties:
        ticketNumber:
          type: string
          description: The unique ticket number to associate with the ingestion
        fileUrl:
          type: string
          description: The URL of the transcript file to ingest
        fileType:
          type: string
          enum: [html, json]
          description: The format of the source file
      required:
        - ticketNumber
        - fileUrl
    AIInsight:
      type: object
      properties:
        title:
          type: string
          description: Professional title describing the insight
        summary:
          type: string
          description: Brief summary of the metric anomaly
        insight:
          type: string
          description: Detailed explanation using contribution data
        confidence_score:
          type: number
          description: Algorithmic confidence in the insight validity
        recommended_actions:
          type: array
          items:
            type: string
          description: Suggested steps for lab members to address the anomaly
        is_verified:
          type: boolean
          description: Whether the insight passed hallucination guardrails
      required:
        - title
        - summary
        - insight
        - confidence_score
        - recommended_actions
        - is_verified
    NLQResponse:
      type: object
      properties:
        query:
          type: string
          description: The original natural language query processed
        data:
          type: array
          items:
            type: object
          description: The resulting anonymized dataset from MongoDB
        summary:
          type: string
          description: AI-generated summary interpreting the data results
        chart:
          type: object
          properties:
            type:
              type: string
              enum: [line, bar, pie, kpi]
            config:
              type: object
          description: Visualization strategy recommended for the data
      required:
        - query
        - data
        - summary
        - chart

