openapi: 3.0.0
paths:
  /auth/register:
    post:
      description: >-
        Fulfills US1. Creates a base-level student JWT access profile to enable
        interactive chat and support features.
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Authentication token granted for new student.
        '400':
          description: Fields missing, email already exists, or password length failure.
        '422':
          description: Malformed request payload.
        '500':
          description: Internal service authentication failure.
      summary: Register New Learner (Identity Onboarding)
      tags: &ref_0
        - Auth and Identity
        - User Onboarding
  /auth/login:
    post:
      description: >-
        Fulfills US1. Requests a JWT token in return for local credentials validation,
        providing the session context for GenAI support.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Access token provided securely.
        '401':
          description: Invalid username or password mismatch.
        '400':
          description: Missing email or password fields.
        '500':
          description: Identity provider synchronization error.
      summary: Local Login (Session Initialization)
      tags: *ref_0
  /auth/me:
    get:
      description: >-
        Fulfills US1. Uses an active bearer token to evaluate the roles and permissions
        assigned to the session node for role-based features.
      operationId: AuthController_getProfile
      parameters: []
      responses:
        '200':
          description: Personal profile details returned.
        '401':
          description: Active session token required.
        '500':
          description: Database node retrieval failure.
      security:
        - bearer: []
      summary: Retrieve Personal Profile (State Sync)
      tags: *ref_0
  /auth/users:
    post:
      description: >-
        Fulfills US11 (Admin Controls). Directly initializes arbitrary roles and parameters
        bypassing registration for governance testing and staff provisioning.
      operationId: AuthController_createUser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: Target identity successfully provisioned.
        '400':
          description: Schema validation failure or duplicate email.
        '403':
          description: Administrative permissions required.
        '500':
          description: Internal identity service error.
      security:
        - bearer: []
      summary: Master Identity Generator (Governance Tool)
      tags: *ref_0
    get:
      description: >-
        Evaluates populations of specific systemic roles (i.e. generating lists
        of purely Lab Members for UI mapping).
      operationId: AuthController_getUsers
      parameters:
        - name: role
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Retrieve Filtered Member Subsets
      tags: *ref_0
  /auth/google:
    get:
      operationId: AuthController_googleLogin
      parameters: []
      responses:
        '200':
          description: ''
      summary: Initiate Google OAuth2 Redirect
      tags: *ref_0
  /auth/google/callback:
    get:
      operationId: AuthController_googleCallback
      parameters: []
      responses:
        '200':
          description: ''
      summary: Google Cloud Callback Target
      tags: *ref_0
  /auth/firebase-sync:
    post:
      description: >-
        Establishes local trust by translating external identity headers to
        native ecosystem JWT equivalents natively.
      operationId: AuthController_firebaseSync
      parameters: []
      responses:
        '201':
          description: ''
      summary: Verify External Firebase JWT
      tags: *ref_0
  /qa-pairs:
    get:
      description: >-
        Fulfills US5 and US6. Retrieves the complete set of verified question-answer
        pairs stored in the GenAI knowledge base to ensure interaction consistency
        across website and Discord channels.
      operationId: QaPairsController_findAll
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: skip
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Verified QA pairs retrieved successfully.
        '401':
          description: Session authentication failed.
        '403':
          description: Insufficient role permissions for knowledge access.
        '500':
          description: Database cluster connectivity failure.
      summary: List All QA Knowledge
      tags: &ref_1
        - QA Pairs
        - GenAI Services
  /qa-pairs/search:
    get:
      description: >-
        Fulfills US6 (Instant Resolution). Allows the chatbot to query the existing
        knowledge base for exact semantic matches before falling back to full
        RAG generation loops.
      operationId: QaPairsController_search
      parameters:
        - name: q
          required: true
          in: query
          description: The semantic search query string
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Semantic search results returned.
        '400':
          description: Empty or malformed query string.
        '404':
          description: No relevant knowledge nodes found.
        '500':
          description: Vector search engine failure.
      summary: Search Knowledge Base (Instant Resolver)
      tags: *ref_1
  /qa-pairs/count:
    get:
      operationId: QaPairsController_count
      parameters: []
      responses:
        '200':
          description: ''
      summary: Count Verified Knowledge Nodes
      tags: *ref_1
  /qa-pairs/source/{source}:
    get:
      description: >-
        Separates knowledge pairs generated from Discord transcripts, PDF
        ingestion, or manual entry.
      operationId: QaPairsController_findBySource
      parameters:
        - name: source
          required: true
          in: path
          description: Origin type (e.g., discord, manual, pdf)
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Filter Knowledge by Source
      tags: *ref_1
  /qa-pairs/{id}:
    get:
      operationId: QaPairsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: QA Pair returned successfully.
      summary: Lookup Specific QA Node
      tags: *ref_1
  /embeddings:
    get:
      description: >-
        Fulfills US11 (Knowledge Governance). Retrieves raw mathematical vector
        sets stored within the GenAI memory index for administrative audit.
      operationId: EmbeddingsController_findAll
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: skip
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Embeddings array successfully extracted.
        '403':
          description: Admin access required for raw vector audit.
        '500':
          description: Index cluster extraction error.
      summary: List Subspace Embeddings (Vector Audit)
      tags: &ref_2
        - GenAI Services
        - Embeddings
  /embeddings/metadata:
    get:
      description: >-
        Retrieves dimensions and algorithm specs for the active GenAI
        embeddings.
      operationId: EmbeddingsController_getMetadata
      parameters: []
      responses:
        '200':
          description: Metadata successfully accessed.
      summary: View Vector Metadata
      tags: *ref_2
  /embeddings/count:
    get:
      description: >-
        Counts the total number of QA pairs fully vectorized in the knowledge
        base.
      operationId: EmbeddingsController_count
      parameters: []
      responses:
        '200':
          description: ''
      summary: Count Total Embeddings
      tags: *ref_2
  /embeddings/{id}:
    get:
      description: Retrieves a single complex vector embedding map by ID.
      operationId: EmbeddingsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '404':
          description: Embedding ID not found in vector space.
      summary: Lookup Embedding Node
      tags: *ref_2
  /embeddings/qa/{qaPairId}:
    get:
      description: >-
        Fulfills US11 correlation logic. Traces a physical QA Pair back to its
        vectorized coordinate in the embedding matrix.
      operationId: EmbeddingsController_findByQaPairId
      parameters:
        - name: qaPairId
          required: true
          in: path
          schema:
            type: string
      responses:
        '404':
          description: The queried QA Pair has no matched embedding.
      summary: Cross-reference Embedding
      tags: *ref_2
  /qa-proposals:
    get:
      description: >-
        Fulfills US11 (Review and Approve). Pulls the list of lab-member-submitted
        knowledge pairs awaiting administrative verification before semantic
        vectorization.
      operationId: QaProposalsController_findAll
      parameters:
        - name: status
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: skip
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Filtered array of knowledge proposals.
        '401':
          description: Active session token required.
        '403':
          description: Administrative or staff role required.
      security: &ref_3
        - bearer: []
      summary: List Pending QA Proposals
      tags: &ref_4
        - GenAI Services
        - QA Proposals
    post:
      description: >-
        Fulfills US11 (Propose Responses). Lab members who resolve a ticket
        manually submit the resolution as a candidate for the GenAI learning
        pipeline.
      operationId: QaProposalsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalDto'
      responses:
        '201':
          description: Knowledge proposal submitted for review.
        '400':
          description: Validation failure on question/answer payload.
        '403':
          description: Requires Lab Member or Admin privileges.
        '500':
          description: Learning pipeline submission failure.
      security: *ref_3
      summary: Propose New Knowledge Item
      tags: *ref_4
  /qa-proposals/stats:
    get:
      description: >-
        Calculates the volume of pending, rejected, and approved embedding
        proposals.
      operationId: QaProposalsController_getStats
      parameters: []
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Proposal Volume Stats
      tags: *ref_4
  /qa-proposals/{id}:
    get:
      description: >-
        Fulfills US11 review step. Loads the exact raw payload proposed by a lab
        member for admin critique.
      operationId: QaProposalsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Evaluate Single Proposal
      tags: *ref_4
    delete:
      operationId: QaProposalsController_delete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Delete Proposal Sandbox Data
      tags: *ref_4
  /qa-proposals/bulk:
    post:
      description: >-
        Mass ingest array of QA rules. Inherits the same US11 requirement
        structures. Used for pipeline parsing integration.
      operationId: QaProposalsController_createBulk
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '201':
          description: ''
      security: *ref_3
      summary: Bulk Import QA Knowledge
      tags: *ref_4
  /qa-proposals/{id}/approve:
    patch:
      description: >-
        Fulfills US11 specific approval clause. The Admin verifies the lab
        member submission. The payload is dynamically sent to the local
        BAAI/BGE-Small embedding service for vectorization and stored in 
        the semantic search cluster.
      operationId: QaProposalsController_approve
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Embedder ran and QA pair accepted natively.
      security: *ref_3
      summary: Verify and Memorize QA Pair
      tags: *ref_4
  /qa-proposals/{id}/reject:
    patch:
      description: >-
        Fulfills US11 specific rejection clause. Denies the embedding pipeline
        execution and flags the initial proposal negatively.
      operationId: QaProposalsController_reject
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewProposalDto'
      responses:
        '200':
          description: ''
      security: *ref_3
      summary: Reject QA Pair
      tags: *ref_4
  /chat/message:
    post:
      description: >-
        Fulfills US1 and US6. Processes a student’s query against the custom-built
        GenAI knowledge base to provide an immediate automated response through
        semantic search and Anthropic Claude Haiku reasoning.
      operationId: ChatController_sendMessage
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageDto'
      responses:
        '200':
          description: Message processed and automated response generated.
        '400':
          description: Validation failed on input payload (e.g. content length).
        '401':
          description: Session token expired or identity rejected.
        '500':
          description: RAG pipeline timeout or model execution failure.
      summary: Send a Chat Message (GenAI Core)
      tags: &ref_5
        - Chat
        - GenAI Services
  /chat/message/stream:
    post:
      description: >-
        Alternative to sendMessage providing real-time UI typing experience.
        Fulfills US1 and US6.
      operationId: ChatController_sendMessageStream
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageDto'
      responses:
        '200':
          description: Stream opened successfully.
      summary: Stream a Chat Message (SSE)
      tags: *ref_5
  /chat/messages/{id}/feedback:
    patch:
      description: >-
        Fulfills US4. Allows a learner to like or dislike an AI-generated answer.
        This feedback is integrated into the US12 analytics heatmap to identify
        defective knowledge clusters.
      operationId: ChatController_addFeedback
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackDto'
      responses:
        '200':
          description: Feedback successfully registered and training logs updated.
        '404':
          description: Target message ID does not exist in chat history.
        '400':
          description: Invalid feedback status provided.
      summary: Submit Message Feedback (Learning Loop)
      tags: *ref_5
  /chat/conversations:
    post:
      description: >-
        Fulfills US1 structural needs. Initializes a fresh conversation context
        for isolated AI interactions.
      operationId: ChatController_createConversation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationDto'
      responses:
        '201':
          description: Conversation Thread Generated.
      summary: Create a New Conversation Thread
      tags: *ref_5
    get:
      description: >-
        Fulfills US9 and US10. Provides paginated lists of systemic
        conversations filtered by status, specific student, or feedback flags.
      operationId: ChatController_getConversations
      parameters:
        - name: status
          required: false
          in: query
          description: Filter conversations by state (active, escalated, resolved)
          schema:
            type: string
        - name: studentId
          required: false
          in: query
          description: Filter by specific student
          schema:
            type: string
        - name: cohort
          required: false
          in: query
          description: Filter by specific cohort
          schema:
            type: string
        - name: feedbackFilter
          required: false
          in: query
          description: Isolate conversations with specific feedback behaviors
          schema:
            type: string
            enum:
              - all
              - liked
              - disliked
              - no-feedback
        - name: page
          required: false
          in: query
          description: Page number for timeline pagination
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Page limit for timeline pagination
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
      responses:
        '200':
          description: Paginated array of conversations.
      summary: Query Conversations
      tags: *ref_5
  /chat/conversations/{id}:
    get:
      description: >-
        Retrieves the full dialogue history for a specific Chat ID. Fulfills US7
        by allowing ticket integration tools to review AI transcripts.
      operationId: ChatController_getConversation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Conversation payload returned.
        '404':
          description: Conversation ID not recognized.
      summary: Retrieve Conversation History
      tags: *ref_5
    delete:
      description: Deletes a dialogue entry from the database.
      operationId: ChatController_deleteConversation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      summary: Purge Specific Thread
      tags: *ref_5
  /chat/stats:
    get:
      description: >-
        Fulfills US10 and US14. Calculates systemic AI accuracy, resolution
        volume, and load metrics for the administrative UI panel.
      operationId: ChatController_getStats
      parameters: []
      responses:
        '200':
          description: Returns analytical aggregations.
      summary: Generate GenAI Statistics
      tags: *ref_5
  /chat/conversations/{id}/resolve:
    patch:
      description: >-
        Fulfills SLA workflows. Closes a dialogue string declaring the student
        successfully retrieved the data.
      operationId: ChatController_resolveConversation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Conversation state changed to Resolved.
      summary: Mark Chat as Resolved
      tags: *ref_5
  /chat/conversations/{id}/escalate:
    patch:
      description: >-
        Fulfills US3 and US7. Notifies the support desk that the GenAI chatbot
        failed to clear the query autonomously, routing the transcript to a 
        human lab member for resolution.
      operationId: ChatController_escalateConversation
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateDto'
      responses:
        '200':
          description: State changed to Escalated; notification sent to staff.
        '404':
          description: Conversation ID not recognized for escalation.
        '500':
          description: Failed to initialize support queue routing.
      summary: Trigger Human Escalation (SLA Routing)
      tags: *ref_5
  /chat/feedback:
    get:
      description: >-
        Fulfills US12 (track negative feedback areas). Extracts all system
        responses that users explicitly flagged as flawed or unhelpful.
      operationId: ChatController_getMessagesWithFeedback
      parameters:
        - name: type
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Retrieve Feedback Analytics
      tags: *ref_5
  /chat/students/{studentId}/conversations:
    get:
      description: >-
        Fulfills US5 pattern verification. Locates previous dialogues initiated
        by a specific learner node.
      operationId: ChatController_getStudentConversations
      parameters:
        - name: studentId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Get Specific Student Transcripts
      tags: *ref_5
  /chat/clear:
    delete:
      description: Internal testing route to purge all threads.
      operationId: ChatController_clearAllData
      parameters: []
      responses:
        '200':
          description: ''
      summary: Clear All Sandbox Data
      tags: *ref_5
  /conversations:
    get:
      description: >-
        Retrieves a consolidated list of dialogues from RAG, Discord, and
        LibreChat sources for review.
      operationId: ConversationController_getConversations
      parameters:
        - name: source
          required: false
          in: query
          schema:
            enum:
              - rag
              - discord
              - librechat
              - all
            type: string
        - name: page
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Unified conversation list retrieved.
      summary: List Unified Conversations
      tags: &ref_6
        - Conversations
        - Analytics
  /conversations/refresh:
    get:
      description: >-
        Fulfills US2/US13. Triggers an active poll to Discord and other plugins
        to sync the latest transcripts manually.
      operationId: ConversationController_refreshConversations
      parameters:
        - name: source
          required: true
          in: query
          schema:
            type: string
        - name: page
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Refresh Conversations
      tags: *ref_6
  /conversations/stats:
    get:
      description: >-
        Calculates active ticket and message counts across all supported plugin
        interfaces.
      operationId: ConversationController_getConversationStats
      parameters:
        - name: refresh
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Conversation Volume Stats
      tags: *ref_6
  /conversations/generate-qa:
    post:
      description: >-
        Fulfills US11 (propose responses). Analyzes a past resolution using 
        Gemini 2.5 Flash and automatically extracts the question-answer pair 
        for the knowledge base.
      operationId: ConversationController_generateQa
      parameters: []
      responses:
        '200':
          description: QA Pair extraction started and returned.
      summary: Generate QA Pair from Transcript
      tags: *ref_6
  /conversations/{source}/{conversationId}:
    get:
      description: >-
        Retrieves the specific messages and metadata for a unique thread
        identified by source and ID.
      operationId: ConversationController_getConversationDetail
      parameters:
        - name: source
          required: true
          in: path
          schema:
            type: string
        - name: conversationId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: Get Conversation Detail
      tags: *ref_6
  /discord-ingestion/conversations:
    get:
      description: >-
        Fulfills US5 and US13. Retrieves a list of conversations ingested from
        Discord for cross-channel consistency audit and knowledge base backfilling.
      operationId: DiscordController_listConversations
      parameters:
        - name: status
          required: false
          in: query
          schema:
            enum:
              - open
              - closed
            type: string
      responses:
        '200':
          description: Discord conversation list retrieved successfully.
        '401':
          description: Staff authentication required.
        '500':
          description: Discord API bridge connectivity failure.
      summary: List Discord Conversations (Channel Sync)
      tags: &ref_7
        - Discord Ingestion
        - GenAI Services
  /discord-ingestion/conversations/{ticketNumber}:
    get:
      description: >-
        Fulfills US7 by providing full transcripts for auditing chatbot-assisted
        escalations on Discord.
      operationId: DiscordController_getConversation
      parameters:
        - name: ticketNumber
          required: true
          in: path
          description: 'The unique ticket number formatted as #number'
          schema:
            type: string
      responses:
        '200':
          description: Specific Discord thread returned.
      summary: Get Discord Conversation Detail
      tags: *ref_7
  /discord-ingestion/stats:
    get:
      description: >-
        Retrieves volumetric counts for the Discord data pipeline to fulfill
        US14 reporting.
      operationId: DiscordController_getStats
      parameters: []
      responses:
        '200':
          description: ''
      summary: Discord Ingestion Statistics
      tags: *ref_7
  /tickets:
    post:
      description: >-
        Fulfills US1 and US3. Allows a learner to escalate a query that the GenAI 
        could not resolve. Supports rich media attachments to provide context 
        for lab member review.
      operationId: TicketsController_createTicket
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketDto'
      responses:
        '201':
          description: Ticket successfully created and entered into the support queue.
        '400':
          description: Validation failed (missing body requirements or invalid file type).
        '401':
          description: Authentication token missing or invalid.
        '500':
